name: NQ Market Monitor

on:
  schedule:
    # Frequent polling for intraday catalyst alerts.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    # Staggered premarket fallback checks in New York local time, away from
    # the top of the hour. Explicit timezone handles US daylight-saving changes.
    - cron: '47 8 * * 1-5'
      timezone: America/New_York
    - cron: '57 8 * * 1-5'
      timezone: America/New_York
    - cron: '7,14 9 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nq-market-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET_TIMEZONE: America/New_York
          # Send once when 15–45 minutes remain before the regular US open.
          # Dedicated cron checks target this interval across US DST changes.
          PREOPEN_MINUTES: '15'
          PREOPEN_WINDOW_MINUTES: '30'
          # Main monitor is also a fallback premarket sender if the dedicated cron is delayed.
          PREMARKET_REPORT_ENABLED: '1'
          PREMARKET_STATE_PATH: data/premarket-state.json
          STATE_PATH: data/state.json
        run: python -m src.main --once

      - name: Persist non-sensitive state
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated state while rebasing the commit on the
          # latest main. This avoids fetch-first failures when another commit
          # lands while the monitor is running.
          if git diff -- data/state.json data/premarket-state.json | grep -q '^'; then
            cp data/state.json /tmp/state.json
            cp data/premarket-state.json /tmp/premarket-state.json
          else
            exit 0
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json data/state.json
            cp /tmp/premarket-state.json data/premarket-state.json
            git add data/state.json data/premarket-state.json

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "chore: update market state [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "State push race on attempt ${attempt}; retrying against latest main..."
          done

          echo "Failed to persist market state after 3 attempts."
          exit 1
