name: Telegram Premarket Test

on:
  workflow_dispatch:

jobs:
  premarket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run real premarket news test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET_TIMEZONE: America/New_York
          PREOPEN_MINUTES: '1440'
          PREOPEN_WINDOW_MINUTES: '1440'
          STATE_PATH: data/test-premarket-state.json
        run: |
          echo "=== REAL NQ NEWS ENGINE TELEGRAM TEST ==="
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from src.config import CONFIG
          from src.sources import collect
          from src.verify import relevance
          from src.storage import Store
          from src.calendar import next_open
          from src.analyzer import analyze, report
          from src.cme_radar import build_radar, format_radar, enrich_test_directions, CONTRACTS
          from src.earnings import upcoming_earnings
          from src.hedge_funds import collect_13f
          from src.telegram import send

          print("1. Collecting live news...")
          store = Store(CONFIG.database_path)
          raw = collect()
          print(f"   Collected raw items: {len(raw)}")

          print("2. Applying compatibility relevance checks...")
          for x in raw:
              s, level, reasons = relevance(x)
              x.update(legacy_score=s, legacy_level=level, reasons=reasons)
          new = store.new_events(raw)
          print(f"   New items in test state: {len(new)}")

          print("3. Building catalyst clusters and ranking...")
          ranked = analyze(new)
          print(f"   Final catalysts: {len(ranked)}")

          # Test-only headline-direction enrichment. Production NQ Market Monitor
          # is not changed. The original directions are retained for CME mapping.
          original_directions = [x.get("direction", "NEUTRAL") for x in ranked]
          enrich_test_directions(ranked)
          for i, x in enumerate(ranked[:10], 1):
              print(f"   {i}. [{x['level']}] {x['title']} | {x['score']}/100 | direction={x.get('direction')} | direct={x.get('nq_directness')} | {x.get('sources', [])}")

          print("4. Validating contract-specific CME directional mapping...")
          test_cases = [
              ({"title": "Wall Street ends sharply higher as AI optimism reignites and Treasury yields retreat", "summary": "", "categories": [], "score": 80, "direction": "NEUTRAL"}, "NQ", "BULLISH PRESSURE"),
              ({"title": "Wall Street ends sharply higher as AI optimism reignites and Treasury yields retreat", "summary": "", "categories": [], "score": 80, "direction": "NEUTRAL"}, "ZN", "BULLISH PRESSURE"),
              ({"title": "European Stocks Recover as Oil Prices Ease", "summary": "", "categories": [], "score": 75, "direction": "BULLISH"}, "CL", "BEARISH PRESSURE"),
              ({"title": "Tokyo Market Closed as Yen Intervention Watch Dominates", "summary": "", "categories": [], "score": 65, "direction": "NEUTRAL"}, "6J", "MIXED"),
          ]
          contracts = {c.symbol: c for c in CONTRACTS}
          from src.cme_radar import _direction
          for item, symbol, expected in test_cases:
              actual = _direction(item, contracts[symbol])
              print(f"   {symbol}: expected={expected} actual={actual}")
              if actual != expected:
                  raise AssertionError(f"CME direction regression for {symbol}: expected {expected}, got {actual}")
          print("   ✅ Directional mapping checks passed")

          now = datetime.now(ZoneInfo(CONFIG.timezone))
          op = next_open(now)
          minutes_to_open = (op - now).total_seconds() / 60
          print(f"5. Next US cash open: {op} ({minutes_to_open:.1f} min)")

          print("6. Building REAL NQ premarket report with 5-trading-day earnings calendar...")
          earnings = upcoming_earnings(days=5)
          print(f"   Relevant earnings found: {len(earnings)}")
          for e in earnings:
              print(f"   {e['date']} {e['symbol']} {e['company']} — {e['time'] or 'time n/a'}")

          # Render KEY CATALYSTS while the test-only headline direction enrichment
          # is active. This affects only this manually-run Telegram test.
          msg = report(ranked, op, minutes_to_open, "source-check", earnings=earnings)

          # Restore the original directions before CME mapping. CME Radar decides
          # direction independently per contract and must not inherit broad NQ/SPX
          # headline direction.
          for x, original in zip(ranked, original_directions):
              x["direction"] = original

          print("7. Building CME futures news radar...")
          cme_rows = build_radar(ranked, limit=18)
          print(f"   CME futures with material news relevance: {len(cme_rows)}")
          for i, x in enumerate(cme_rows, 1):
              print(f"   {i}. {x['symbol']} {x['name']} | impact={x['impact']} | move={x['move_potential']} | catalyst={x['catalyst_strength']} | {x['direction']} | {x['title']}")

          print("8. Checking Radar / Market Map consistency...")
          full_cme_rows = build_radar(ranked, limit=len(CONTRACTS))
          radar_text = format_radar(ranked, limit=18)
          for row in full_cme_rows:
              marker = f'<b>{row["symbol"]}</b> — {row["name"]}'
              if marker not in radar_text:
                  raise AssertionError(f"Market Map missing material contract {row['symbol']}")
          print("   ✅ Material contracts are present in the Market Map")

          funds = collect_13f()
          if funds:
              msg += "\n\n🏦 13F / HEDGE-FUND DISCOVERY\n" + "\n".join(
                  f'• {x["title"]} — {x["source"]}' for x in funds[:5]
              )

          # CME Radar is deliberately appended LAST so the normal news,
          # verification, earnings and 13F sections remain the primary feed.
          msg += "\n\n" + radar_text

          print("\n===== TELEGRAM MESSAGE PREVIEW =====")
          print(msg)
          print("===== END TELEGRAM MESSAGE PREVIEW =====\n")

          print("9. Sending REAL report to Telegram...")
          ok = send(CONFIG.telegram_token, CONFIG.telegram_chat_id, msg)
          if not ok:
              raise RuntimeError("Telegram send() returned False")
          print("   ✅ MAIN PREMARKET REPORT SENT")
          print("\n=== TEST COMPLETED SUCCESSFULLY ===")
          PY
