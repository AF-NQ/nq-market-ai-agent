name: Telegram Premarket Test

on:
  workflow_dispatch:

jobs:
  premarket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run real premarket news test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKET_TIMEZONE: America/New_York
          PREOPEN_MINUTES: '1440'
          PREOPEN_WINDOW_MINUTES: '1440'
          STATE_PATH: data/test-premarket-state.json
        run: |
          echo "=== REAL NQ NEWS ENGINE TELEGRAM TEST ==="
          echo "Collecting live public market news..."
          echo "Clustering duplicate headlines into catalysts..."
          echo "Building the same report used by production..."
          echo "Sending the report to Telegram..."
          echo ""

          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from src.config import CONFIG
          from src.sources import collect
          from src.verify import relevance
          from src.storage import Store
          from src.calendar import next_open
          from src.analyzer import analyze, report, urgent_messages
          from src.earnings import upcoming_earnings
          from src.hedge_funds import collect_13f
          from src.telegram import send

          print("1. Collecting live news...")
          store = Store(CONFIG.database_path)
          raw = collect()
          print(f"   Collected raw items: {len(raw)}")

          print("2. Applying compatibility relevance checks...")
          for x in raw:
              s, level, reasons = relevance(x)
              x.update(legacy_score=s, legacy_level=level, reasons=reasons)

          new = store.new_events(raw)
          print(f"   New items in test state: {len(new)}")

          print("3. Building catalyst clusters and ranking...")
          ranked = analyze(new)
          print(f"   Final catalysts: {len(ranked)}")

          for i, x in enumerate(ranked[:10], 1):
              print(f"   {i}. [{x['level']}] {x['title']} | {x['score']}/100 | {x.get('sources', [])}")

          print("4. Resolving next US cash open (display only; no production gate)...")
          now = datetime.now(ZoneInfo(CONFIG.timezone))
          op = next_open(now)
          minutes_to_open = (op - now).total_seconds() / 60
          print(f"   Current time: {now}")
          print(f"   Next open: {op}")
          print(f"   Minutes to open: {minutes_to_open:.1f}")

          print("5. Building REAL NQ premarket-format report...")
          msg = report(ranked, op, minutes_to_open, "source-check")

          earnings = upcoming_earnings()
          if earnings:
              msg += (
                  "\n\n📅 MEGA-CAP EARNINGS TODAY\n"
                  + "\n".join(
                      f'{e["symbol"]} {e["company"]} — {e["time"] or "time n/a"}'
                      for e in earnings
                  )
              )

          funds = collect_13f()
          if funds:
              msg += (
                  "\n\n🏦 13F / HEDGE-FUND DISCOVERY\n"
                  + "\n".join(
                      f'• {x["title"]}\n  {x["link"]}'
                      for x in funds[:5]
                  )
              )

          print("\n===== TELEGRAM MESSAGE PREVIEW =====")
          print(msg)
          print("===== END TELEGRAM MESSAGE PREVIEW =====\n")

          print("6. Sending REAL report to Telegram...")
          ok = send(CONFIG.telegram_token, CONFIG.telegram_chat_id, msg)
          if not ok:
              raise RuntimeError("Telegram send() returned False")
          print("   ✅ MAIN PREMARKET REPORT SENT")

          print("7. Checking urgent catalyst alerts...")
          alerts = urgent_messages(ranked)
          print(f"   Urgent alerts: {len(alerts)}")
          for alert in alerts:
              if not send(CONFIG.telegram_token, CONFIG.telegram_chat_id, alert):
                  raise RuntimeError("Telegram urgent alert send() returned False")
              print("   ✅ Urgent alert sent")

          print("\n=== TEST COMPLETED SUCCESSFULLY ===")
          PY
